<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Active Rooms Overview</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');

    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-1: #3b82f6;
      --accent-2: #8b5cf6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 25%);
      background-attachment: fixed;
    }

    header {
      margin-bottom: 3rem;
      text-align: center;
      animation: fadeInDown 0.8s ease-out;
    }

    h1 {
      font-size: 3rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.2rem;
    }

    .rooms-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
      width: 100%;
      max-width: 1200px;
    }

    .room-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: fadeInUp 0.5s ease-out backwards;
    }

    .room-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .room-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 1rem;
    }

    .room-code {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 2px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      color: #10b981;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.1);
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
    }

    .pulse {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      animation: pulsing 2s infinite cubic-bezier(0.66, 0, 0, 1);
    }

    .room-stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.25rem;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 700;
    }
    
    .stat-value.participants {
        color: var(--accent-1);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem;
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px dashed rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
    }
    
    .top-bar {
        width: 100%;
        max-width: 1200px;
        display: flex;
        justify-content: flex-end;
        margin-bottom: 1rem;
    }
    
    .refresh-info {
        font-size: 0.9rem;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    /* Animations */
    @keyframes pulsing {
      to {
        box-shadow: 0 0 0 10px rgba(16, 185, 129, 0);
      }
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Rooms Overview</h1>
    <p class="subtitle">Live monitoring of active translation rooms</p>
  </header>
  
  <div class="top-bar">
      <div class="refresh-info">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.59-9.28l5.67-5.67"/>
          </svg>
          Auto-updating every 3 seconds
      </div>
  </div>

  <div class="rooms-container" id="rooms-container">
    <!-- Rooms will be injected here via JS -->
  </div>

  <script>
    const container = document.getElementById('rooms-container');

    function formatUptime(createdAt) {
      const now = Date.now();
      const diffMs = now - createdAt;
      const diffMins = Math.floor(diffMs / 60000);
      
      if (diffMins < 1) return '< 1 min';
      if (diffMins < 60) return `${diffMins} min${diffMins !== 1 ? 's' : ''}`;
      
      const hours = Math.floor(diffMins / 60);
      const mins = diffMins % 60;
      return `${hours}h ${mins}m`;
    }

    async function fetchRooms() {
      try {
        const response = await fetch('/api/rooms');
        const data = await response.json();
        renderRooms(data.rooms);
      } catch (error) {
        console.error('Error fetching rooms:', error);
      }
    }

    function renderRooms(rooms) {
      if (!rooms || rooms.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 1rem; opacity: 0.5;">
              <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
            </svg>
            <h2>No Active Rooms</h2>
            <p style="margin-top: 0.5rem">There are currently no active translation sessions.</p>
          </div>
        `;
        return;
      }
      
      let html = '';
      rooms.forEach((room, index) => {
        const uptime = formatUptime(room.createdAt);
        // stagger animations initially
        const delay = index * 0.1;
        
        html += `
          <div class="room-card" style="animation-delay: ${delay}s">
            <div class="room-header">
              <span class="room-code">${room.code}</span>
              <div class="status-indicator">
                <div class="pulse"></div>
                Live
              </div>
            </div>
            <div class="room-stats">
              <div class="stat-box">
                <span class="stat-label">Participants</span>
                <span class="stat-value participants">${room.listenerCount}</span>
              </div>
              <div class="stat-box" style="text-align: right;">
                <span class="stat-label">Uptime</span>
                <span class="stat-value" style="font-size: 1.2rem; color: #e2e8f0; margin-top: auto;">${uptime}</span>
              </div>
            </div>
          </div>
        `;
      });
      
      container.innerHTML = html;
    }

    // Initial fetch
    fetchRooms();

    // Poll every 3 seconds
    setInterval(fetchRooms, 3000);
  </script>
</body>
</html>
