name: EAS Development Build (Local)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Development Client (Local)
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: "2G"
          key: ${{ runner.os }}-android-ccache

      - name: Install project dependencies
        run: npm ci --legacy-peer-deps

      - name: Install EAS CLI globally
        run: npm install -g eas-cli

      - name: Decode Android Keystore
        id: decode_keystore
        run: |
          KEYSTORE_PATH="${PWD}/production.keystore"
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"
          echo "Keystore decoded to $KEYSTORE_PATH"
          echo "keystore_path=$KEYSTORE_PATH" >> $GITHUB_OUTPUT

      - name: Create credentials.json
        run: |
          echo '{
            "android": {
              "keystore": {
                "keystorePath": "${{ steps.decode_keystore.outputs.keystore_path }}",
                "keystorePassword": "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}",
                "keyAlias": "${{ secrets.ANDROID_KEYSTORE_ALIAS }}",
                "keyPassword": "${{ secrets.ANDROID_KEY_PASSWORD }}"
              }
            }
          }' > credentials.json
          echo "credentials.json created successfully."

      - name: Build development client locally for Android
        run: eas build --profile development --platform android --local --non-interactive
        env:
          GRADLE_OPTS: "-Xmx2560m -XX:MaxMetaspaceSize=512m -Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=true"
          REACT_NATIVE_ARCHS: "arm64-v8a"
          NDK_CCACHE: "ccache"
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find . -maxdepth 1 -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "APK not found in root directory!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tour-translation-dev-apk
          path: ${{ steps.find_apk.outputs.path }}
