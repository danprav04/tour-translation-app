name: Local EAS Android AAB Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile (must produce app-bundle)'
        required: true
        default: 'production-aab'
        type: choice
        options:
          - production-aab

jobs:
  build-android-aab:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: 🏗 Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🏗 Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🚀 Build Android AAB locally
        run: eas build --platform android --profile ${{ github.event.inputs.profile }} --local --non-interactive --output ./app-build.aab
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 📤 Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.event.inputs.profile }}-aab
          path: ./app-build.aab
          if-no-files-found: error
