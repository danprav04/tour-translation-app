name: Local EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (android, ios)'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
      profile:
        description: 'EAS build profile'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - preview
          - production

jobs:
  build-android:
    if: ${{ github.event.inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - name: 🗑 Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false # we need android sdk
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: 🏗 Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🏗 Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🚀 Build locally (Android)
        run: eas build --platform android --profile ${{ github.event.inputs.profile }} --local --non-interactive --output ./app-build.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4096m -XX:MaxMetaspaceSize=512m -Dorg.gradle.workers.max=1 -Dorg.gradle.parallel=false -Dorg.gradle.caching=true"

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.event.inputs.profile }}-build
          path: ./app-build.apk

  build-ios:
    if: ${{ github.event.inputs.platform == 'ios' }}
    runs-on: macos-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: 🏗 Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🚀 Build locally (iOS)
        run: eas build --platform ios --profile ${{ github.event.inputs.profile }} --local --non-interactive --output ./app-build.tar.gz
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ github.event.inputs.profile }}-build
          path: ./app-build.tar.gz
